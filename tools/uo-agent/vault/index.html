<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a header, the chest wall drawn as it stands (6 columns x 4 rows) with the crates beside it, then every chest's bags in wall order. */
:root {
  --bg: #eceef0;
  --panel: #f8f9fa;
  --ink: #1d2328;
  --muted: #5d6772;
  --line: #d2d8dd;
  --accent: #85560f;
  --accent-soft: #f2e5c9;
  --font-display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121619; --panel: #1a1f23; --ink: #e3e7ea; --muted: #929da7; --line: #2b3339;
    --accent: #d8a74c; --accent-soft: #3a2f1a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121619; --panel: #1a1f23; --ink: #e3e7ea; --muted: #929da7; --line: #2b3339;
  --accent: #d8a74c; --accent-soft: #3a2f1a; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
.page {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
  display: grid; gap: 28px;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; }
h1 { font-size: 2.6rem; line-height: 1; letter-spacing: 0.01em; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.05rem; font-family: var(--font-body); font-weight: 600; }
.eyebrow { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.72rem; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

header { display: grid; gap: 14px; }
.sub { color: var(--muted); max-width: 62ch; margin: 0; }
.totals { display: flex; flex-wrap: wrap; gap: 8px; }
.total { display: flex; gap: 6px; align-items: baseline; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.total b { font-variant-numeric: tabular-nums; font-weight: 600; }

.search { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.search input {
  flex: 1 1 260px; min-width: 0; font: inherit; font-size: 1rem; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink);
}
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.room { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: start; }
@media (max-width: 860px) { .room { grid-template-columns: minmax(0, 1fr); } }

.wall-wrap { overflow-x: auto; }
.wall { display: grid; grid-template-columns: auto repeat(6, minmax(112px, 1fr)); gap: 6px; min-width: 760px; }
.wall > .chest { grid-column: var(--c); grid-row: var(--r); }
.chest .pos { display: none; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.wall .colhead, .wall .rowhead { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.wall .colhead { text-align: center; padding-bottom: 2px; }
.wall .rowhead { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; padding: 0 2px; }
.chest {
  display: grid; gap: 2px; align-content: start; min-height: 74px; padding: 8px 9px;
  border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: inherit; text-decoration: none;
}
.chest:hover, .chest:focus-visible { border-color: var(--accent); outline: none; }
.playerbags { margin-top: 12px; display: grid; gap: 6px; }
.playerbag-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; max-width: 420px; }
.chest .name { font-family: var(--font-display); font-size: 1rem; line-height: 1.15; }
.chest .count { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.chest.empty { background: transparent; border-style: dashed; }
.chest.hit { border-color: var(--accent); background: var(--accent-soft); }
.chest.miss { opacity: 0.45; }

.crates { display: grid; gap: 6px; min-width: 200px; }
.crate { display: flex; justify-content: space-between; gap: 12px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.crate .n { font-variant-numeric: tabular-nums; font-weight: 600; }

.chests { display: grid; gap: 30px; }
.chest-section { display: grid; gap: 12px; scroll-margin-top: 16px; }
.chest-head { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.bags { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.bag { display: grid; gap: 6px; align-content: start; min-width: 0; }
.bag-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.marker { font-size: 0.8rem; color: var(--muted); }
ul.items { list-style: none; margin: 0; padding: 0; display: grid; }
ul.items li { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; border-bottom: 1px dotted var(--line); min-width: 0; }
ul.items li > span:first-child { min-width: 0; overflow-wrap: anywhere; }
ul.items li .amt { font-variant-numeric: tabular-nums; color: var(--muted); flex: none; }
ul.items li .gold { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.8rem; }
.worth { font-size: 0.85rem; color: var(--ink); }
.worth b { font-variant-numeric: tabular-nums; }
ul.items ul.items { padding-left: 14px; grid-column: 1 / -1; }
li.nest { display: grid !important; }
li.nest > .row { display: flex; justify-content: space-between; gap: 12px; }
.tier { color: var(--accent); font-weight: 600; }
mark { background: var(--accent-soft); color: inherit; border-radius: 2px; padding: 0 1px; }
.part { border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
.castle { display: grid; gap: 20px; }
.areas { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.area { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 2px; color: inherit; text-decoration: none; }
.area b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.area.miss { opacity: 0.45; }
/* the castle's chests as they stand, as the game draws them: each stack a column (its top chest at the top, the
   floor chest at the bottom), the columns left to right in the order they appear on screen (screen x goes with
   map x minus map y) */
.layout { display: grid; gap: 22px; }
.layout-area { display: grid; gap: 8px; }
.stack-wrap { overflow-x: auto; padding-bottom: 4px; }
.wallgrid { display: grid; grid-template-columns: 44px repeat(var(--n), minmax(96px, 1fr)); gap: 6px; width: max-content; min-width: 100%; }
.wallgrid .colhead { font-size: 0.78rem; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; align-self: end; }
.wallgrid .rowhead { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; align-self: center; }
.wallgrid .chest { min-height: 60px; padding: 6px 8px; }
.wallgrid .chest .name { font-size: 0.92rem; }
.wallgrid .blank { min-height: 0; }
.chest.yours { border-color: var(--accent); }
.layout-note { font-size: 0.8rem; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; }
.secure-tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 4px; margin-left: 6px; vertical-align: 2px; }
.note { padding: 14px; border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); }
footer { color: var(--muted); font-size: 0.8rem; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
/* phones and narrow windows: the wall becomes tiles in wall order (column by column, top to bottom), each with its place */
@media (max-width: 820px) {
  .wall { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); min-width: 0; }
  .wall > .chest { grid-column: auto; grid-row: auto; order: var(--o); min-height: 0; }
  .wall .colhead, .wall .rowhead, .wall .corner { display: none; }
  .chest .pos { display: block; }
  .crates { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); min-width: 0; }
  .crates .eyebrow { grid-column: 1 / -1; }
  h1 { font-size: 2.1rem; }
}</style>

</div>

","amount":7,"graphic":"0x0F2D","each":45},{"name":"star sapphires","amount":6,"graphic":"0x0F21","each":75},{"name":"sapphires","amount":5,"graphic":"0x0F19","each":60},{"name":"emeralds","amount":3,"graphic":"0x0F10","each":60}]}],"loose":[]},{"serial":"0x406E3BFC","name":"reagents","side":"vault","place":"my vault 940","row":"top","secure":false,"bags":[],"loose":[]},{"serial":"0x406E5DAB","name":"reagents","side":"vault","place":"my vault 940","row":"2nd","secure":false,"bags":[],"loose":[]},{"serial":"0x406EC384","name":"scrolls","side":"vault","place":"my vault 940","row":"3rd","secure":false,"bags":[],"loose":[]},{"serial":"0x406EDB9B","name":"free","side":"vault","place":"my vault 940","row":"floor","secure":false,"bags":[],"loose":[]},{"serial":"0x406E34E8","name":"gold","side":"vault","place":"my vault 941","row":"top","secure":false,"bags":[],"loose":[]},{"serial":"0x406DD7D0","name":"gold","side":"vault","place":"my vault 941","row":"2nd","secure":false,"bags":[],"loose":[]},{"serial":"0x406E2D98","name":"gold","side":"vault","place":"my vault 941","row":"3rd","secure":false,"bags":[],"loose":[]},{"serial":"0x406EF58B","name":"gold","side":"vault","place":"my vault 941","row":"floor","secure":false,"bags":[],"loose":[]},{"serial":"0x406ECA50","name":"valuables overflow","side":"vault","place":"my vault 942","row":"top","secure":false,"bags":[],"loose":[]},{"serial":"0x406EE45B","name":"free","side":"vault","place":"my vault 942","row":"2nd","secure":false,"bags":[],"loose":[]},{"serial":"0x406DF442","name":"free","side":"vault","place":"my vault 942","row":"3rd","secure":false,"bags":[],"loose":[]},{"serial":"0x406F29C0","name":"free","side":"vault","place":"my vault 942","row":"floor","secure":false,"bags":[],"loose":[]},{"serial":"0x409397CC","name":"to repair","side":"forge","place":"red backpack by the forge, 946,2323","row":"on the floor","secure":false,"player":true,"bags":[],"loose":[]},{"serial":"0x4098F2E3","name":"repaired","side":"forge","place":"green backpack by the forge, 947,2323","row":"on the floor","secure":false,"player":true,"bags":[],"loose":[]}],"castle_updated":"2026-11-23T11:21:01-0800","tools_room":{"updated":"2026-11-24T15:24:35-0800","bags":4,"in_use":4,"tools":[{"name":"shovels","amount":177}]}};</script>
<script>
const ROWS = ['top', '2nd from top', '3rd from top', 'bottom'];
const TIERS = /\b(vanquishing|power|force|invulnerability|fortification|hardening|exceptional)\b/i;
const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString('en-US');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const slug = (s) => 'chest-' + s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
let data = null;

function sum(items) {
  return items.reduce((t, i) => t + (i.items ? sum(i.items) : i.amount), 0);
}
function worth(items) {  // gold a jeweler pays for the gems among them
  return items.reduce((t, i) => t + (i.items ? worth(i.items) : (i.each || 0) * i.amount), 0);
}
// a bag's count includes its marker, like the chest totals (the user, 2026-11-14: the treasure maps bag said 0 with a map as its marker)
function bagGems(b) {  // the user sells the marker gem with the bag (2026-11-11)
  return (b.marker && b.marker.each ? [b.marker] : []).concat(b.items);
}
function chestItems(c) {
  return c.loose.concat(...c.bags.map((b) => (b.marker ? [b.marker] : []).concat(b.items)));
}
function show(name, q) {
  let html = esc(cap(name));
  html = html.replace(TIERS, (m) => `<span class="tier">${m}</span>`);
  if (q) {
    const i = html.toLowerCase().indexOf(esc(q).toLowerCase());
    if (i >= 0 && !/<[^>]*$/.test(html.slice(0, i))) html = html.slice(0, i) + '<mark>' + html.slice(i, i + esc(q).length) + '</mark>' + html.slice(i + esc(q).length);
  }
  return html;
}
function matches(item, q) {
  return item.name.toLowerCase().includes(q) || (item.items || []).some((i) => matches(i, q));
}
function list(items, q) {
  const shown = q ? items.filter((i) => matches(i, q)) : items;
  if (!shown.length) return '';
  return '<ul class="items">' + shown.map((i) => i.items
    ? `<li class="nest"><div class="row"><span>${show(i.name, q)}</span><span class="amt">${fmt(sum(i.items))}</span></div>${list(i.items, q) || '<ul class="items"><li><span class="muted">empty</span></li></ul>'}</li>`
    : `<li><span>${show(i.name, q)}${i.each ? ` <span class="gold">${fmt(i.each)} gp each</span>` : ''}</span><span class="amt">${i.amount > 1 ? fmt(i.amount) : ''}${i.each ? ` · ${fmt(i.each * i.amount)} gp` : ''}</span></li>`).join('') + '</ul>';
}

function render() {
  const q = $('q').value.trim().toLowerCase();
  const found = renderCastle(q);
  $('hits').textContent = q ? (found ? `${found} found` : 'Nothing in the castle matches that.') : '';
}

const AREAS = [['east', 'East storage', 'east wall, x 947'], ['forge', 'By the forge', 'crafting, x 944'],
  ['vault', 'Your vault', 'south-east, behind your table'], ['west', 'West storage', 'west wall, x 921']];

function bagsHtml(c, q) {
  const bagHit = (b) => !q || b.name.toLowerCase().includes(q) || (b.marker && matches(b.marker, q)) || b.items.some((i) => matches(i, q));
  return c.bags.filter(bagHit).map((b) => {
    const full = q && b.name.toLowerCase().includes(q) ? '' : q;
    return `<div class="bag"><div class="bag-head"><h3>${show(b.name, q)}</h3><span class="amt muted num">${fmt(sum((b.marker ? [b.marker] : []).concat(b.items)))}</span></div>`
      + (worth(bagGems(b)) ? `<div class="worth">Sells for <b>${fmt(worth(bagGems(b)))} gold</b> at a jeweler${b.marker && b.marker.each ? ', with the marker gem' : ''}</div>` : '')
      + (b.marker ? `<div class="marker">Marker under the bag: ${show(b.marker.name, q)}</div>` : '')
      + (list(b.items, full) || `<div class="marker">${b.marker ? 'Nothing in the bag yet; the marker is the only one' : 'Empty'}</div>`) + '</div>';
  });
}

const STACK_ROWS = ['top', '2nd', '3rd', 'floor'];

// a chest's map position from its place: "east 2329" (x 947), "forge 2326" (x 944), "my vault 938" (y 2348),
// "intake 938,2349"
function spot(c) {
  let m = c.place.match(/(\d+),(\d+)/);
  if (m) return [+m[1], +m[2]];
  m = c.place.match(/(\d+)$/);
  const n = m ? +m[1] : 0;
  if (c.place.startsWith('east')) return [947, n];
  if (c.place.startsWith('forge')) return [944, n];
  if (c.place.startsWith('my vault')) return [n, 2348];
  return [0, 0];
}
// the layout's groups: the intake chests stand in the south-east, beside the user's vault
const LAYOUT = [['east', 'East storage', 'the east wall, x 947: north end on the right', (c) => c.side === 'east' && !c.place.startsWith('intake')],
  ['forge', 'By the forge', 'x 944, next to the forges', (c) => c.side === 'forge' && !c.player],
  ['vault', 'Your vault', 'south-east, behind your table: the stack nearest the entrance on the left', (c) => c.side === 'vault' || c.place.startsWith('intake')]];

// the players' bags on the floor by the forge (the user, 2026-11-21): counted, never touched by Clem
function playerBagsHtml(castle) {
  const bags = castle.filter((c) => c.player);
  if (!bags.length) return '';
  return '<div class="playerbags"><span class="eyebrow">On the floor by the forge · players only</span><div class="playerbag-row">'
    + bags.map((c) => {
      const n = sum(chestItems(c));
      return `<a class="chest yours" href="#c-${c.serial}" title="${esc(c.place)}"><span class="name">${esc(cap(c.name))}</span>`
        + `<span class="count">${n ? fmt(n) + ' items' : 'empty'} · ${esc(c.place.split(' backpack')[0])} backpack</span></a>`;
    }).join('') + '</div></div>';
}

function layoutHtml(castle, q, hitsOf) {
  return LAYOUT.map(([side, name, where, take]) => {
    const cs = castle.filter(take);
    if (!cs.length) return '';
    const places = [...new Set(cs.map((c) => c.place))]
      .sort((a, b) => { const pa = spot(cs.find((c) => c.place === a)), pb = spot(cs.find((c) => c.place === b)); return (pa[0] - pa[1]) - (pb[0] - pb[1]) || pa[1] - pb[1]; });
    let html = '<span></span>' + places.map((pl) => `<span class="colhead">${esc(pl.replace(/^(east|forge|my vault) /, '').replace(/^intake /, 'intake<br>'))}</span>`.replace('&lt;br&gt;', '<br>')).join('');
    STACK_ROWS.forEach((r) => {
      html += `<span class="rowhead">${r}</span>`;
      html += places.map((pl) => {
        const c = cs.find((h) => h.place === pl && h.row === r);
        if (!c) return '<div class="blank"></div>';
        const own = c.personal || /^(yours|friend's|Clem's)/.test(c.name);  // not managed: not counted, not shown inside
        const n = own ? 0 : sum(chestItems(c));
        const cls = ['chest', n || own ? '' : 'empty', own ? 'yours' : '',
          q ? (hitsOf(c) ? 'hit' : 'miss') : ''].filter(Boolean).join(' ');
        const body = `<span class="name">${esc(cap(c.name))}</span>`
          + `<span class="count">${own ? 'personal' : n ? fmt(n) + ' items' : 'empty'}${c.secure ? ' · secure' : ''}</span>`;
        return n ? `<a class="${cls}" href="#c-${c.serial}" title="${esc(pl)}, ${r}">${body}</a>` : `<div class="${cls}" title="${esc(pl)}, ${r}">${body}</div>`;
      }).join('');
    });
    return `<div class="layout-area"><h3>${esc(name)} <span class="muted">· ${esc(where)}</span></h3>`
      + `<div class="stack-wrap"><div class="wallgrid" style="--n:${places.length}">${html}</div></div>`
      + `<div class="layout-note"><span>← left on your screen</span><span>right on your screen →</span></div>`
      + (side === 'forge' ? playerBagsHtml(castle) : '') + '</div>';
  }).join('');
}

// the tools room (the user, 2026-11-21): bulk tools in backpacks stacked on the floor of the south-east room, shown
// combined, one total per tool ("don't list each bag just list the total number of shovels")
function toolsCard(q) {
  const t = data.tools_room;
  if (!t) return ['', 0];
  const tools = q ? t.tools.filter((i) => matches(i, q)) : t.tools;
  const hits = q ? tools.reduce((n, i) => n + i.amount, 0) : 0;
  const n = t.tools.reduce((m, i) => m + i.amount, 0);
  const card = `<a class="area${q && !hits ? ' miss' : ''}" href="#castle-tools"><span class="eyebrow">Tools room</span><b>${q ? (hits ? `${fmt(hits)} found` : 'no match') : `${fmt(n)} tools`}</b><span class="muted">${t.in_use} of ${t.bags} bags in use · south-east, backpacks on the floor</span></a>`;
  return [card, hits];
}
function toolsSection(q) {
  const t = data.tools_room;
  if (!t || (q && !t.tools.some((i) => matches(i, q)))) return '';
  const when = new Date(t.updated).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  return `<h2 id="castle-tools">Tools room</h2><section class="chest-section"><div class="chest-head"><h2>Every bag combined</h2><span class="muted">South-east room, backpacks stacked along the walls · ${t.bags} bags · counted ${when}</span></div><div class="bags"><div class="bag"><div class="bag-head"><h3>Tools</h3><span class="amt muted num">${fmt(t.tools.reduce((m, i) => m + i.amount, 0))}</span></div>${list(t.tools, q) || '<div class="marker">Empty</div>'}</div></div></section>`;
}

function renderCastle(q) {
  const castle = data.castle || [];
  if (!castle.length) {
    $('castle').innerHTML = '<h2 class="part">The castle</h2><div class="note">The castle hasn\'t been counted yet: it fills as the move from the tower goes on.</div>';
    return 0;
  }
  let found = 0;
  const hitsOf = (c) => chestItems(c).filter((i) => matches(i, q)).length + c.bags.filter((b) => b.name.toLowerCase().includes(q)).length;
  const areas = AREAS.map(([side, name, where]) => {
    const cs = castle.filter((c) => c.side === side && !c.player);
    const used = cs.filter((c) => sum(chestItems(c)));
    const hits = q ? cs.reduce((t, c) => t + hitsOf(c), 0) : 0;
    found += hits;
    const n = cs.reduce((t, c) => t + sum(chestItems(c)), 0);
    return `<a class="area${q && !hits ? ' miss' : ''}" href="#castle-${side}"><span class="eyebrow">${esc(name)}</span><b>${q ? (hits ? `${fmt(hits)} found` : 'no match') : `${fmt(n)} items`}</b><span class="muted">${used.length} of ${cs.length} chests in use · ${esc(where)}</span></a>`;
  }).join('');
  const [toolsArea, toolHits] = toolsCard(q);
  found += toolHits;
  const sections = AREAS.map(([side, name]) => {
    const cs = castle.filter((c) => c.side === side && !c.personal && !/^(yours|friend's|Clem's)/.test(c.name)
      && (c.player || c.bags.length || c.loose.length) && (!q || hitsOf(c)));
    if (!cs.length) return '';
    cs.sort((a, b) => (b.player ? 1 : 0) - (a.player ? 1 : 0));  // the players' bags first
    return `<h2 id="castle-${side}">${esc(name)}</h2>` + cs.map((c) => {
      const loose = list(c.loose, q);
      if (c.player) return `<section class="chest-section" id="c-${c.serial}"><div class="chest-head"><h2>${esc(cap(c.name))}<span class="secure-tag">players only</span></h2><span class="muted">${esc(c.place)} · ${fmt(sum(chestItems(c)))} items · Clem never moves anything in or out</span></div><div class="bags">`
        + bagsHtml(c, q).join('') + (loose ? `<div class="bag"><div class="bag-head"><h3>In the bag</h3></div>${loose}</div>` : '') + '</div></section>';
      return `<section class="chest-section" id="c-${c.serial}"><div class="chest-head"><h2>${esc(cap(c.name))}${c.secure ? '<span class="secure-tag">secure</span>' : ''}</h2><span class="muted">${esc(c.place)}, ${esc(c.row)} · ${fmt(sum(chestItems(c)))} items</span></div><div class="bags">`
        + bagsHtml(c, q).join('') + (loose ? `<div class="bag"><div class="bag-head"><h3>Loose in the chest</h3></div>${loose}</div>` : '') + '</div></section>';
    }).join('');
  }).join('');
  const when = data.castle_updated ? new Date(data.castle_updated).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  $('castle').innerHTML = `<h2 class="part">The castle</h2><p class="muted">Counted by Clem${when ? ` on ${when}` : ''}. Empty chests aren't listed below.</p><div class="areas">${areas}${toolsArea}</div>`
    + `<h2>Where everything is</h2><p class="muted">As you see them in the game: each column is one stack of chests, its top chest at the top, and the columns run left to right as on your screen. Tap a chest to see what's in it.</p><div class="layout">${layoutHtml(castle, q, hitsOf)}</div>` + sections + toolsSection(q);
  return found;
}

function header() {
  const when = new Date(data.castle_updated || data.updated);
  $('updated').textContent = `Every chest and bag in the castle, counted on ${when.toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}.`;
  const all = (data.castle || []).filter((c) => !c.player);
  const named = (n) => all.filter((c) => c.name === n || c.name.startsWith(n + ',') || c.name.startsWith(n + ' '));
  const total = (n) => named(n).reduce((t, c) => t + sum(chestItems(c)), 0);
  const potions = all.filter((c) => / potions \d+$/.test(c.name)).reduce((t, c) => t + sum(chestItems(c)), 0);
  const bags = all.reduce((t, c) => t + c.bags.length, 0);
  const gemBag = worth([].concat(...named('gems').map((c) => [].concat(...c.bags.map(bagGems)))));
  const used = all.filter((c) => sum(chestItems(c))).length;
  const parts = [['chests in use', used], ['bags', bags], ['gems', total('gems')], ['gold for the gems', gemBag], ['reagents', total('reagents')], ['scrolls', total('scrolls')], ['potions', potions], ['tools in the tools room', ((data.tools_room || {}).tools || []).reduce((t, i) => t + i.amount, 0)]];
  $('totals').innerHTML = parts.map(([k, v]) => `<span class="total"><b>${fmt(v)}</b><span class="muted">${k}</span></span>`).join('');
}

data = window.VAULT;
if (data) { header(); render(); } else { $('updated').textContent = 'No inventory has been written into this page yet.'; }
$('q').addEventListener('input', () => data && render());
</script>
